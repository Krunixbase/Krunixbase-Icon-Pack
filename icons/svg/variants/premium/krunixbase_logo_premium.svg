<svg width="220" height="220" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

    <!-- Premium gradient tła: fiolet → niebieski → zielony -->
    <defs>
        <linearGradient id="bgPremium" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6A00FF" />
            <stop offset="50%" stop-color="#00A8FF" />
            <stop offset="100%" stop-color="#00FF7F" />
        </linearGradient>

        <!-- Metaliczny gradient dla heksagonu -->
        <linearGradient id="strokePremiumHex" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="40%" stop-color="#E8E8E8" />
            <stop offset="100%" stop-color="#C0C0C0" />
        </linearGradient>

        <!-- Premium gradient dla litery K (połysk) -->
        <linearGradient id="strokePremiumK" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="30%" stop-color="#F0FFF8" />
            <stop offset="100%" stop-color="#A8FFD4" />
        </linearGradient>
    </defs>

    <!-- Tło premium -->
    <rect width="512" height="512" fill="url(#bgPremium)" />

    <!-- Heksagon premium -->
    <polygon
        points="256,60 380,140 380,280 256,360 132,280 132,140"
        fill="none"
        stroke="url(#strokePremiumHex)"
        stroke-width="14"
    />

    <!-- Litera K premium -->
    <path
        d="
      M176 170
      L226 170
      L226 240

      L276 170
      L336 170
      L276 245

      L336 310
      L276 310
      L226 255

      L226 310
      L176 310
      Z
    "
        fill="url(#strokePremiumK)"
    />

</svg>
