<svg width="220" height="220" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

    <!-- Gradient tła: ciemny → bardzo ciemny (mono premium) -->
    <defs>
        <linearGradient id="bgMono" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2A2A2A" />
            <stop offset="100%" stop-color="#0D0D0D" />
        </linearGradient>

        <!-- Gradient dla heksagonu i litery K: jasny → ciemny szary -->
        <linearGradient id="strokeMono" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#B5B5B5" />
        </linearGradient>
    </defs>

    <!-- Tło gradientowe -->
    <rect width="512" height="512" fill="url(#bgMono)" />

    <!-- Heksagon -->
    <polygon
        points="256,60 380,140 380,280 256,360 132,280 132,140"
        fill="none"
        stroke="url(#strokeMono)"
        stroke-width="14"
    />

    <!-- Litera K -->
    <path
        d="
      M176 170
      L226 170
      L226 240

      L276 170
      L336 170
      L276 245

      L336 310
      L276 310
      L226 255

      L226 310
      L176 310
      Z
    "
        fill="url(#strokeMono)"
    />

</svg>
